name: Tests

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suite & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck -x bin/aiab entrypoint.sh scripts/install.sh scripts/install-kata.sh shell/aiab.bash

      - name: Run test suite
        run: |
          chmod +x tests/test_runner.sh
          ./tests/test_runner.sh

      - name: Verify Docker image builds
        run: |
          docker build --build-arg USER_UID=1001 --build-arg USER_GID=1001 -t agy-test .
